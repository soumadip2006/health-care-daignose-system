<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login – AI HealthCare</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Poppins", sans-serif;
    }

    body{
        background:linear-gradient(135deg,#dfe9ff,#f5f8ff);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        width:380px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 8px 30px rgba(0,0,0,0.15);
        text-align:center;
    }

    h2{
        color:#3d5afe;
        margin-bottom:10px;
        font-size:30px;
    }

    .subtitle{
        color:#777;
        margin-bottom:25px;
        font-size:14px;
    }

    input{
        width:100%;
        padding:13px;
        margin-top:15px;
        border-radius:12px;
        border:2px solid #d7dbff;
        font-size:15px;
        transition:0.3s;
    }

    input:focus{
        border-color:#3d5afe;
        outline:none;
        box-shadow:0 0 8px rgba(61,90,254,0.2);
    }

    button{
        width:100%;
        padding:13px;
        margin-top:22px;
        background:#3d5afe;
        color:white;
        border:none;
        border-radius:12px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
        font-weight:600;
    }

    button:hover{
        background:#2c47cc;
    }

    p{
        margin-top:18px;
        font-size:14px;
        color:#555;
    }

    a{
        color:#3d5afe;
        text-decoration:none;
        font-weight:600;
    }

    a:hover{
        text-decoration:underline;
    }

    .demo{
        display: none;          /* HIDE DEMO USERS */
        margin-top:20px;
        background:#eef2ff;
        padding:12px;
        border-radius:10px;
        font-size:13px;
        color:#555;
        text-align:left;
    }

</style>
</head>

<body>

<div class="container">

    <h2>Login</h2>

    <div class="subtitle">
        Welcome to AI HealthCare Assistant
    </div>

    <!-- EMAIL -->
    <input
        type="email"
        id="email"
        placeholder="Enter Email"
    >

    <!-- PASSWORD -->
    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <!-- LOGIN BUTTON -->
    <button onclick="loginUser()">
        Login
    </button>

    <p>
        Don't have an account?
        <a href="signup.html">Signup</a>
    </p>

    <!-- DEMO USERS -->
    <div class="demo">
        <b>Demo Login:</b><br><br>

        Email:
        user@gmail.com<br>
        Password:
        12345
    </div>

</div>

<script>

/* =========================================================
   USER DATABASE (Dictionary/Object)
========================================================= */

const users = {
    "user1@gmail.com":"12345",
    "admin@gmail.com":"admin123",
    "soumadip@gmail.com":"2006",
    "vedansh@gmail.com":"vedansh123"
};


/* =========================================================
   LOGIN FUNCTION
========================================================= */

function loginUser(){

    // GET INPUT VALUES

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value
    .trim();


    /* CHECK EMAIL EXISTS */

    if(users[email]){

        /* CHECK PASSWORD */

        if(users[email] === password){

            alert("Login Successful ✅");

            // REDIRECT
            window.location.href = "main.html";
        }
        else{

            alert(
                "Invalid Password ❌"
            );
        }
    }
    else{

        alert(
            "Invalid Credentials ❌"
        );
    }
}

</script>

</body>
</html>
