<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Reports – AI HealthCare</title>

<style>
    body {
        background: #f5f8ff;
        font-family: "Poppins", sans-serif;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #3d5afe;
    }

    #connectBtn {
        padding: 12px 25px;
        background: #3d5afe;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        margin: 20px auto;
        display: block;
        transition: 0.3s;
    }

    #connectBtn:hover {
        background: #2c47cc;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 6px 30px rgba(0,0,0,0.10);
    }

    .card h2 {
        color: #3d5afe;
        margin-bottom: 8px;
    }

    .value {
        font-size: 32px;
        font-weight: bold;
        margin-top: 10px;
        color: #222;
    }
</style>

</head>
<body>

<h1>📊 Live Health Monitoring</h1>

<button id="connectBtn">🔗 Connect Bluetooth Health Band</button>

<div class="cards">
    <div class="card">
        <h2>Heart Rate ❤️</h2>
        <div id="heartRate" class="value">-- BPM</div>
    </div>

    <div class="card">
        <h2>Blood Pressure 🩺</h2>
        <div id="bp" class="value">-- / --</div>
    </div>

    <div class="card">
        <h2>Oxygen Level 🫁</h2>
        <div id="oxygen" class="value">-- %</div>
    </div>

    <div class="card">
        <h2>Body Temperature 🌡️</h2>
        <div id="temp" class="value">-- °C</div>
    </div>
</div>

<script>
/**************************************************
 REAL BLUETOOTH API
 Supports: Heart Rate, Blood Pressure, Temperature
**************************************************/

const heartRateEl = document.getElementById("heartRate");
const bpEl = document.getElementById("bp");
const oxygenEl = document.getElementById("oxygen");
const tempEl = document.getElementById("temp");

document.getElementById("connectBtn").addEventListener("click", connectDevice);

async function connectDevice() {
    try {
        const device = await navigator.bluetooth.requestDevice({
            filters: [
                { services: ["heart_rate"] },
                { services: ["blood_pressure"] },
                { services: ["health_thermometer"] },
                { services: ["oxygen_saturation"] }
            ],
            optionalServices: ["battery_service"]
        });

        const server = await device.gatt.connect();

        readHeartRate(server);
        readBloodPressure(server);
        readTemperature(server);
        readSpO2(server);

        alert("Health Band Connected ✔");

    } catch (error) {
        alert("Connection failed: " + error);
    }
}

/************ HEART RATE ************/
async function readHeartRate(server) {
    try {
        const service = await server.getPrimaryService("heart_rate");
        const characteristic = await service.getCharacteristic("heart_rate_measurement");

        characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", (event) => {
            const value = event.target.value;
            const heartRate = value.getUint8(1);
            heartRateEl.innerText = heartRate + " BPM";
        });
    } catch (e) { console.warn("Heart Rate not available"); }
}

/************ BLOOD PRESSURE ************/
async function readBloodPressure(server) {
    try {
        const service = await server.getPrimaryService("blood_pressure");
        const characteristic = await service.getCharacteristic("blood_pressure_measurement");

        characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", (event) => {
            const data = event.target.value;
            const systolic = data.getUint8(1);
            const diastolic = data.getUint8(3);
            bpEl.innerText = `${systolic} / ${diastolic}`;
        });
    } catch (e) { console.warn("Blood Pressure not available"); }
}

/************ TEMPERATURE ************/
async function readTemperature(server) {
    try {
        const service = await server.getPrimaryService("health_thermometer");
        const characteristic = await service.getCharacteristic("temperature_measurement");

        characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", (event) => {
            const data = event.target.value;
            const tempRaw = data.getUint16(1, true);
            const tempC = (tempRaw / 100).toFixed(1);
            tempEl.innerText = `${tempC} °C`;
        });
    } catch (e) { console.warn("Temperature not available"); }
}

/************ OXYGEN LEVEL (SpO2) ************/
async function readSpO2(server) {
    try {
        const service = await server.getPrimaryService("oxygen_saturation");
        const characteristic = await service.getCharacteristic("continuous_measurement");

        characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", (event) => {
            const oxygen = event.target.value.getUint8(1);
            oxygenEl.innerText = oxygen + " %";
        });
    } catch (e) { console.warn("SpO2 not available"); }
}

</script>

</body>
</html>
