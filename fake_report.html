<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Reports – AI HealthCare</title>

<style>
    body {
        background: #f5f8ff;
        font-family: "Poppins", sans-serif;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #3d5afe;
    }

    /* Connect Button */
    #connectBtn {
        padding: 12px 25px;
        background: #3d5afe;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        margin: 20px auto;
        display: block;
        transition: 0.3s;
    }

    #connectBtn:hover {
        background: #2c47cc;
    }

    /* Data Cards */
    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 6px 30px rgba(0,0,0,0.10);
    }

    .card h2 {
        color: #3d5afe;
        margin-bottom: 8px;
    }

    .value {
        font-size: 32px;
        font-weight: bold;
        margin-top: 10px;
        color: #222;
    }

    canvas {
        margin-top: 40px;
        background: white;
        padding: 20px;
        border-radius: 18px;
        box-shadow: 0 6px 30px rgba(0,0,0,0.1);
    }
</style>

</head>
<body>

<h1>📊 Live Health Monitoring</h1>

<button id="connectBtn">🔗 Connect Bluetooth Health Band</button>

<!-- Live Data Cards -->
<div class="cards">
    <div class="card">
        <h2>Heart Rate ❤️</h2>
        <div id="heartRate" class="value">-- BPM</div>
    </div>

    <div class="card">
        <h2>Blood Pressure 🩺</h2>
        <div id="bp" class="value">-- / --</div>
    </div>

    <div class="card">
        <h2>Oxygen Level 🫁</h2>
        <div id="oxygen" class="value">-- %</div>
    </div>

    <div class="card">
        <h2>Body Temperature 🌡️</h2>
        <div id="temp" class="value">-- °C</div>
    </div>
</div>

<!-- Graph Section -->
<h1 style="margin-top:40px;">📈 Health History</h1>
<canvas id="healthChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* ============================
   HEALTH DATA STORAGE
============================ */

let historyData = JSON.parse(localStorage.getItem("healthHistory")) || {
    time: [],
    heart: [],
    oxygen: [],
    temp: []
};

/* ============================
   BLUETOOTH API (SIMULATION)
============================ */
// When health band is connected
document.getElementById("connectBtn").addEventListener("click", async () => {
    alert("Simulated: Bluetooth Band Connected Successfully!");

    // In real device: request Bluetooth
    /*
    const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: ['heart_rate'] }]
    });
    */

    simulateLiveData(); // Start simulating
});

/* ============================
   SIMULATED LIVE HEALTH DATA
============================ */

function simulateLiveData() {
    setInterval(() => {
        let heart = Math.floor(Math.random() * (110 - 70) + 70);
        let oxygen = Math.floor(Math.random() * (98 - 92) + 92);
        let temp = (Math.random() * (37 - 36) + 36).toFixed(1);
        let highBP = Math.floor(Math.random() * (130 - 110) + 110);
        let lowBP = Math.floor(Math.random() * (90 - 70) + 70);

        // Display Live
        document.getElementById("heartRate").innerText = heart + " BPM";
        document.getElementById("oxygen").innerText = oxygen + " %";
        document.getElementById("temp").innerText = temp + " °C";
        document.getElementById("bp").innerText = highBP + " / " + lowBP;

        // Save history
        let time = new Date().toLocaleTimeString();
        historyData.time.push(time);
        historyData.heart.push(heart);
        historyData.oxygen.push(oxygen);
        historyData.temp.push(temp);

        localStorage.setItem("healthHistory", JSON.stringify(historyData));

        updateChart();

    }, 3000); // Every 3 seconds
}

/* ============================
   CHART (HEALTH HISTORY)
============================ */

const ctx = document.getElementById("healthChart");

let chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: historyData.time,
        datasets: [
            {
                label: "Heart Rate (BPM)",
                data: historyData.heart,
                borderWidth: 3
            },
            {
                label: "Oxygen (%)",
                data: historyData.oxygen,
                borderWidth: 3
            },
            {
                label: "Temperature (°C)",
                data: historyData.temp,
                borderWidth: 3
            }
        ]
    },
    options: {
        responsive: true,
        scales: {
            y: { beginAtZero: false }
        }
    }
});

// Update Chart Live
function updateChart() {
    chart.data.labels = historyData.time;
    chart.data.datasets[0].data = historyData.heart;
    chart.data.datasets[1].data = historyData.oxygen;
    chart.data.datasets[2].data = historyData.temp;

    chart.update();
}

</script>

</body>
</html>
